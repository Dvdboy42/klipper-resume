[plr_logger]
log_file: /home/klipper/printer_data/config/plr_resume/printer_state/printer_state.json
interval: 2
temperature_fan_name: EXHAUST_FAN

[gcode_shell_command plr_resume]
command: python3 /home/klipper/printer_data/config/plr_resume/plr_resume.py -v
timeout: 30.0
verbose: True

[gcode_macro PLR_RESUME]
gcode:
    {% set NOPRINT = params.NOPRINT|default('false') %}
    RUN_SHELL_COMMAND CMD=plr_resume
    {% if NOPRINT == 'true' %}
        RESPOND TYPE=echo MSG="Generated output file without starting the print."
    {% else %}
        SDCARD_PRINT_FILE FILENAME="plr_recovery.gcode"
    {% endif %}
    

[gcode_macro PLR_RESUME_START_GCODE]
gcode:
    {% set MOVE_SPEED = 400 %}
    {% set BED_TEMP = params.BED_TEMP|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|float %}
    {% set EXHAUST_TEMP = params.EXHAUST_TEMP|float %}
    {% set FAN_SPEED = params.FAN_SPEED|float %}
    {% set Z_LIFT = 10 %}
    {% set Z_LIFT_TEMP = 185 %}
    {% set X = params.X|float %}
    {% set Y = params.Y|float %}
    {% set Z = params.Z|float %}
    {% set E = params.E|float %}

    UPDATE_DELAYED_GCODE ID=EXHAUST_FAN_OFF DURATION=0
    SET_FILAMENT_SENSOR SENSOR=mdm_motion_sensor ENABLE=0
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=EXHAUST_FAN TARGET={EXHAUST_TEMP}

    G90
    SET_KINEMATIC_POSITION E={E}
    SET_KINEMATIC_POSITION Z={Z}
    STOP_LED_EFFECTS
    LED_ON
    M140 S{BED_TEMP}
    M104 S{Z_LIFT_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={Z_LIFT_TEMP - 5}

    M83
    G91
    G1 Z{Z_LIFT}
    G90
    M104 S0
    G28 X Y
    G1 X3 Y3 F{MOVE_SPEED * 60}

    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 1} MAXIMUM={BED_TEMP + 4}
    M104 S{EXTRUDER_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP - 4} MAXIMUM={EXTRUDER_TEMP + 5}
    G1 Z{Z} F900
    G1 E20 F600
    M106 S{FAN_SPEED}
    G1 E-3 F600
    G1 F18000

